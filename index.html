<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADIL SMART CAR</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    min-height:100vh;
    background:#101318;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
}

.header{
    padding:18px 10px 10px;
}

.header h1{
    margin:0;
    font-size:26px;
}

.header p{
    color:#aaa;
    margin:6px 0;
}

.status{
    display:inline-block;
    margin:8px;
    padding:7px 14px;
    border-radius:20px;
    background:#252a31;
    color:#00ff88;
    font-size:13px;
}

.container{
    width:94%;
    max-width:500px;
    margin:auto;
}

/* CAMERA */

.camera{
    width:100%;
    height:230px;
    background:#050505;
    border:2px solid #303640;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:10px 0 20px;
}

.camera span{
    color:#777;
    font-size:18px;
}

/* CONTROLS */

.controls{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
    width:300px;
    max-width:100%;
    margin:auto;
}

.btn{
    height:75px;
    border:none;
    border-radius:18px;
    background:#252b33;
    color:white;
    font-size:30px;
    font-weight:bold;
    box-shadow:0 5px 12px rgba(0,0,0,.35);
    touch-action:manipulation;
}

.btn:active{
    transform:scale(.94);
    background:#3a424d;
}

.stop{
    background:#c62828;
}

.stop:active{
    background:#ef4444;
}

/* FEATURES */

.features{
    display:flex;
    gap:12px;
    margin-top:22px;
}

.feature{
    flex:1;
    padding:15px 8px;
    border-radius:15px;
    background:#20252c;
}

.feature button{
    width:100%;
    padding:13px 5px;
    border:none;
    border-radius:10px;
    background:#303741;
    color:white;
    font-size:16px;
}

.feature button.active{
    background:#18794e;
}

/* SPEED */

.speed-box{
    margin-top:20px;
    background:#20252c;
    padding:16px;
    border-radius:15px;
}

.speed-box h3{
    margin:0 0 10px;
}

input[type="range"]{
    width:90%;
}

.speed-value{
    margin-top:8px;
    font-size:18px;
}

.footer{
    margin:25px 0;
    color:#777;
    font-size:12px;
}
</style>
</head>

<body>

<div class="header">

<h1>🚗 ADIL SMART CAR</h1>

<p>ESP32-CAM 4-Wheel Wi-Fi Controller</p>

<div class="status" id="status">
● Controller Ready
</div>

</div>


<div class="container">

<!-- CAMERA -->

<div class="camera">
<span>🎥 ESP32-CAM VIDEO</span>
</div>


<!-- 8 DIRECTION CONTROLS -->

<div class="controls">

<button class="btn"
onpointerdown="move('forward_left')"
onpointerup="stopCar()"
onpointercancel="stopCar()">
↖️
</button>

<button class="btn"
onpointerdown="move('forward')"
onpointerup="stopCar()"
onpointercancel="stopCar()">
⬆️
</button>

<button class="btn"
onpointerdown="move('forward_right')"
onpointerup="stopCar()"
onpointercancel="stopCar()">
↗️
</button>


<button class="btn"
onpointerdown="move('left')"
onpointerup="stopCar()"
onpointercancel="stopCar()">
⬅️
</button>

<button class="btn stop"
onclick="stopCar()">
🛑
</button>

<button class="btn"
onpointerdown="move('right')"
onpointerup="stopCar()"
onpointercancel="stopCar()">
➡️
</button>


<button class="btn"
onpointerdown="move('reverse_left')"
onpointerup="stopCar()"
onpointercancel="stopCar()">
↙️
</button>

<button class="btn"
onpointerdown="move('reverse')"
onpointerup="stopCar()"
onpointercancel="stopCar()">
⬇️
</button>

<button class="btn"
onpointerdown="move('reverse_right')"
onpointerup="stopCar()"
onpointercancel="stopCar()">
↘️
</button>

</div>


<!-- LED + HORN -->

<div class="features">

<div class="feature">

<div>💡 LED</div>

<br>

<button id="ledButton" onclick="toggleLED()">
OFF
</button>

</div>


<div class="feature">

<div>📢 HORN</div>

<br>

<button
onpointerdown="hornOn()"
onpointerup="hornOff()"
onpointercancel="hornOff()">
HOLD
</button>

</div>

</div>


<!-- SPEED -->

<div class="speed-box">

<h3>⚡ SPEED</h3>

<input
type="range"
id="speed"
min="0"
max="100"
value="70"
oninput="changeSpeed(this.value)"
>

<div class="speed-value">

<span id="speedValue">70</span>%

</div>

</div>

</div>


<div class="footer">

ESP32-CAM Smart Car Controller

</div>


<script>

const ESP32_IP = "10.67.19.19";

let ledState = false;


/* STATUS */

function setStatus(message){

    document.getElementById("status").innerText =
    "● " + message;

}


/* SEND COMMAND TO ESP32 */

function sendCommand(command, value = null){

    let url =
    "http://" + ESP32_IP +
    "/command?cmd=" +
    encodeURIComponent(command);

    if(value !== null){

        url += "&value=" +
        encodeURIComponent(value);

    }

    fetch(url)

    .then(response => response.text())

    .then(data => {

        console.log("ESP32:", data);

    })

    .catch(error => {

        console.log("ESP32 ERROR:", error);

        setStatus("ESP32 connection error");

    });

}


/* MOVEMENT */

function move(direction){

    setStatus(
        "Moving: " +
        direction.replace("_"," ").toUpperCase()
    );

    sendCommand(direction);

}


/* STOP */

function stopCar(){

    setStatus("Stopped");

    sendCommand("stop");

}


/* LED */

function toggleLED(){

    ledState = !ledState;

    const button =
    document.getElementById("ledButton");


    if(ledState){

        button.innerText = "ON";

        button.classList.add("active");

        setStatus("LED ON");

        sendCommand("led_on");

    }

    else{

        button.innerText = "OFF";

        button.classList.remove("active");

        setStatus("LED OFF");

        sendCommand("led_off");

    }

}


/* HORN */

function hornOn(){

    setStatus("HORN ON");

    sendCommand("horn_on");

}


function hornOff(){

    setStatus("Ready");

    sendCommand("horn_off");

}


/* SPEED */

function changeSpeed(value){

    document.getElementById("speedValue")
    .innerText = value;

    sendCommand("speed",value);

}

</script>

</body>
</html>
